<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - Bonjel Pharmacy</title>
    <link rel="stylesheet" href="sales.css">
</head>
<body>

<!-- Sidebar -->
<nav>
    <h2>💊 Bonjel</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="inventory.html">Inventory</a>
    <a href="sell.html">Sell</a>
    <a href="sales.html">Sales</a>
    <a href="index.html">Logout</a>
</nav>

<!-- Main Content -->
<div class="container">

    <h1>Sales History</h1>

    <!-- Cards -->
    <div class="cards-container">
        <div class="card" id="totalSales">📦 Total Sales: 0</div>
        <div class="card" id="totalRevenue">💰 Total Revenue: ₦0</div>
        <div class="card" id="totalProfit">📊 Total Profit: ₦0</div>
        <div class="card" id="todayRevenue">🧾 Today's Revenue: ₦0</div>
    </div>

    <!-- Filter Buttons -->
    <section class="filter">
        <button id="filterToday">Today</button>
        <button id="filterWeek">This Week</button>
        <button id="filterMonth">This Month</button>
    </section>

    <!-- Table -->
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Medicine</th>
                <th>Qty</th>
                <th>Cost Price</th>
                <th>Selling Price</th>
                <th>Profit/Loss</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="salesTableBody"></tbody>
    </table>

</div>

<script src="sales.js"></script>
</body>
</html>
